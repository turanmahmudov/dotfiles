set -g focus-events on
set -g history-limit 50000
set -sg escape-time 10
set -gw aggressive-resize on
set -g detach-on-destroy previous
set -g monitor-activity on
set -g visual-activity off

# Terminal
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh

# The window title names the session, so a jump can find the terminal window that shows it.
set -g set-titles on
set -g set-titles-string "#S - tmux"

# True color + undercurl/underline colors (tmux 3.2+)
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Let kitty graphics and other OSC sequences reach the terminal
set -g allow-passthrough on

# A server started from a coding agent inherits GIT_EDITOR=true, which makes git
# skip the commit message editor in every pane. Drop it so git falls back to EDITOR.
set-environment -gr GIT_EDITOR

# Windows & Pane numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Key binds
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# remap prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Make the current window the first window
bind T swap-window -t 1

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# Bound back explicitly, so a reload after the old binding also restores it
bind d detach-client
# claude/cli windows
bind C run-shell "tmux list-windows -F '##{window_name}' | grep -qx 'claude' || (tmux new-window -n claude -c '#{pane_current_path}' && tmux send-keys -t claude 'claude' Enter); tmux list-windows -F '##{window_name}' | grep -qx 'cli' || tmux new-window -n cli -c '#{pane_current_path}'; tmux select-window -t #{window_index}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy mode
# set -s set-clipboard off
set -gw mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Sessionizer
bind-key -r f run-shell "tmux neww zsh -i -c tmux-sessionizer"

# Diff review in its own window
# tmux hands the command to the pane escaped, so the variable has to reach a shell of its own.
bind-key R new-window -c "#{pane_current_path}" -n review "sh -c '\${GIT_REVIEW:-tuicr -w}'"

# Coding agents
# Each agent writes its own state through ~/.local/bin/agent, which sets these options.
set -g @agent-color-blocked colour3
set -g @agent-color-working colour2
set -g @agent-color-done colour4
bind-key a display-popup -E -w 60% -h 50% "~/.local/bin/agent jump"

# Bind 'w' to a custom key table called 'window-join'
bind-key w switch-client -T window-join
# Press: Prefix -> w -> h
bind-key -T window-join h command-prompt -p "Join window as vertical pane:" "join-pane -s '%%' -h"
# Press: Prefix -> w -> v
bind-key -T window-join v command-prompt -p "Join window as horizontal pane:" "join-pane -s '%%' -v"
# Prefix + B: Kick the current active pane back out into its own window
bind-key B break-pane -d

# Themeing
source ~/.config/themes/_generated/tmux.conf

# Status bar
set -g status "on"
set -g status-position bottom
set -g status-justify "left"
set -g status-style "fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Status bar content
set -g status-left "#[fg=#{@STATUS_HIGHLIGHTED_ITEM_FG_COLOR},bg=#{@STATUS_HIGHLIGHTED_ITEM_BG_COLOR},bold] #S "
set -g status-right "#[fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}]#{?client_prefix, PREFIX ,}#[fg=#{@STATUS_HIGHLIGHTED_ITEM_FG_COLOR},bg=#{@STATUS_HIGHLIGHTED_ITEM_BG_COLOR},bold] #h "

# Agent state of the window, reported by the agent itself
set -g @agent_marker "#{?#{==:#{@agent_state},blocked},#[fg=#{@agent-color-blocked}#,bold]● ,#{?#{==:#{@agent_state},working},#[fg=#{@agent-color-working}]◐ ,#{?#{==:#{@agent_state},done},#[fg=#{@agent-color-done}#,bold]✓ ,}}}"

# Window status
set -gw window-status-separator ""
set -gw window-status-activity-style "underscore,fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR}"
set -gw window-status-style "NONE,fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR}"
set -gw window-status-format " #{E:@agent_marker}#[fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR},nobold]#I: #W #F "
set -gw window-status-current-format "#[fg=#{@WINDOW_STATUS_FG_COLOR},bg=#{@WINDOW_STATUS_BG_COLOR},bold] #{E:@agent_marker}#[fg=#{@WINDOW_STATUS_FG_COLOR},bg=#{@WINDOW_STATUS_BG_COLOR},bold]#I: #W #F "

# Other styles
set -g mode-style "fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}"
set -g message-style "fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}"
set -g message-command-style "fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}"
set -g pane-border-style "fg=#{@PANE_BORDER_FG_COLOR}"
set -g pane-active-border-style "fg=#{@PANE_ACTIVE_BORDER_FG_COLOR}"

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Plugins list
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Without lazygit here, tmux swallows C-j and C-k as pane moves when lazygit
# runs directly in a pane. It only worked when launched from inside Neovim.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf|lazygit)(diff)?(-wrapped)?'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
