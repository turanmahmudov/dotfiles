set -g focus-events on
set -g history-limit 50000
set -sg escape-time 10
set -gw aggressive-resize on
set -g detach-on-destroy previous
set -g monitor-activity on
set -g visual-activity off

# Terminal
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh

# True color + undercurl/underline colors (tmux 3.2+)
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Windows & Pane numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Key binds
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# remap prefix from C-b to C-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Make the current window the first window
bind T swap-window -t 1

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind d run-shell "tmux list-windows -F '##{window_name}' | grep -qx 'claude' || (tmux new-window -n claude -c '#{pane_current_path}' && tmux send-keys -t claude 'claude' Enter); tmux list-windows -F '##{window_name}' | grep -qx 'cli' || tmux new-window -n cli -c '#{pane_current_path}'; tmux select-window -t #{window_index}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy mode
# set -s set-clipboard off
set -gw mode-keys vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# Sessionizer
bind-key -r f run-shell "tmux neww zsh -i -c tmux-sessionizer"

# Themeing
source ~/.config/themes/_generated/tmux.conf

# Status bar
set -g status "on"
set -g status-position bottom
set -g status-justify "left"
set -g status-style "fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR}"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Status bar content
set -g status-left "#[fg=#{@STATUS_HIGHLIGHTED_ITEM_FG_COLOR},bg=#{@STATUS_HIGHLIGHTED_ITEM_BG_COLOR},bold] #S "
set -g status-right "#[fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}]#{?client_prefix, PREFIX ,}#[fg=#{@STATUS_HIGHLIGHTED_ITEM_FG_COLOR},bg=#{@STATUS_HIGHLIGHTED_ITEM_BG_COLOR},bold] #h "

# Window status
set -gw window-status-separator ""
set -gw window-status-activity-style "underscore,fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR}"
set -gw window-status-style "NONE,fg=#{@STATUS_FG_COLOR},bg=#{@STATUS_BG_COLOR}"
set -gw window-status-format " #I: #W #F "
set -gw window-status-current-format "#[fg=#{@WINDOW_STATUS_FG_COLOR},bg=#{@WINDOW_STATUS_BG_COLOR},bold] #I: #W #F "

# Other styles
set -g mode-style "fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}"
set -g message-style "fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}"
set -g message-command-style "fg=#{@STATUS_ITEM_FG_COLOR},bg=#{@STATUS_ITEM_BG_COLOR}"
set -g pane-border-style "fg=#{@PANE_BORDER_FG_COLOR}"
set -g pane-active-border-style "fg=#{@PANE_ACTIVE_BORDER_FG_COLOR}"

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Plugins list
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
