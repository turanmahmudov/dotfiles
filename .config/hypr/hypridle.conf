general {
    lock_cmd = pidof hyprlock || hyprlock      # Screen locker
    before_sleep_cmd = loginctl lock-session   # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on # Turn monitors back on after suspend

    # Respect inhibitors so media players and long jobs can hold off idling
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim the backlight as a warning shortly before locking
listener {
    timeout = 240                                  # 4 minutes
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock the session after 5 minutes of inactivity
listener {
    timeout = 300                                  # 5 minutes
    on-timeout = loginctl lock-session
}

# Turn the screen off shortly after locking
listener {
    timeout = 330                                  # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend the system after 10 minutes of inactivity
listener {
    timeout = 600                                  # 10 minutes
    on-timeout = systemctl suspend
}
