display_name: Nord
wallpaper: wallpaper.png

nvim_colorscheme: nordfox

scripts:
  - vicinae theme set nord

colors:
  # Base background scale (darkest -> lightest)
  bg: "#2e3440"
  bg_alt: "#3b4252"
  bg_alt2: "#434c5e"
  surface: "#4c566a"

  # Foreground scale (dimmest -> brightest)
  fg_dim: "#abb1bb"
  fg: "#d8dee9"
  fg_alt: "#e5e9f0"
  fg_bright: "#eceff4"

  # Accent
  accent: "#81a1c1"
  accent_alt: "#5e81ac"
  accent_fg: "#001c37"
  cursor: "#81a1c1"

  # ANSI 16
  black: "#3b4252"
  red: "#bf616a"
  green: "#a3be8c"
  yellow: "#ebcb8b"
  blue: "#81a1c1"
  magenta: "#b48ead"
  cyan: "#88c0d0"
  white: "#e5e9f0"
  bright_black: "#4c566a"
  bright_red: "#bf616a"
  bright_green: "#a3be8c"
  bright_yellow: "#ebcb8b"
  bright_blue: "#81a1c1"
  bright_magenta: "#b48ead"
  bright_cyan: "#8fbcbb"
  bright_white: "#eceff4"

  # Semantic
  success: "#a3be8c"
  warning: "#ebcb8b"
  error: "#bf616a"
  info: "#88c0d0"
  urgent: "#bf616a"
  active: "#a3be8c"
